<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Đồng hồ LCD</title>
<style>
:root{--bg:#000;--on:#ff2a1a;--off:transparent;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
body{display:flex;align-items:center;justify-content:center;cursor:pointer}
#clock{width:min(98vw,380vh);height:auto;display:block}
body.p #clock{width:min(96vw,43vh)}
.seg{fill:var(--off)}
.seg.on{fill:var(--on);filter:drop-shadow(0 0 3px rgba(255,42,26,.75))}
.dot{fill:var(--on);filter:drop-shadow(0 0 3px rgba(255,42,26,.75))}
#date{display:none;text-align:center;white-space:nowrap;font:700 100px/1.15 ui-monospace,"SF Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace;color:var(--on);text-shadow:0 0 8px rgba(255,42,26,.7)}
#hint{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));text-align:center;font:14px/1.2 system-ui,sans-serif;color:#5a1a14;transition:opacity 1s;pointer-events:none}
#hint.hide{opacity:0}
</style>
</head>
<body>
<svg id="clock" viewBox="0 0 392 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Đồng hồ"></svg>
<div id="date"></div>
<div id="hint">Chạm để bật/tắt toàn màn hình</div>
<script>
(function(){
  var NS="http://www.w3.org/2000/svg";
  var svg=document.getElementById("clock");
  var P={
    a:"8,5 12,1 48,1 52,5 48,9 12,9",
    b:"56,7 60,11 60,45 56,49 52,45 52,11",
    c:"56,51 60,55 60,89 56,93 52,89 52,55",
    d:"8,95 12,91 48,91 52,95 48,99 12,99",
    e:"4,51 8,55 8,89 4,93 0,89 0,55",
    f:"4,7 8,11 8,45 4,49 0,45 0,11",
    g:"8,50 12,46 48,46 52,50 48,54 12,54"
  };
  var M=["abcdef","bc","abdeg","abcdg","bcfg","acdfg","acdefg","abc","abcdefg","abcdfg"];
  var LAND={vb:"0 0 392 100",pos:[[0,0,1],[72,0,1],[166,0,1],[238,0,1],[326,50,.5],[362,50,.5]]};
  var PORT={vb:"0 0 132 290",pos:[[0,0,1],[72,0,1],[0,120,1],[72,120,1],[66,240,.5],[102,240,.5]]};
  var groups=[],digits=[];
  for(var n=0;n<6;n++){
    var g=document.createElementNS(NS,"g"),segs={};
    "abcdefg".split("").forEach(function(k){
      var p=document.createElementNS(NS,"polygon");
      p.setAttribute("points",P[k]);p.setAttribute("class","seg");
      g.appendChild(p);segs[k]=p;
    });
    svg.appendChild(g);groups.push(g);digits.push(segs);
  }
  var dots=[];
  [[149,28,10],[149,62,10],[312,64,5],[312,81,5]].forEach(function(q){
    var r=document.createElementNS(NS,"rect");
    r.setAttribute("x",q[0]-q[2]/2);r.setAttribute("y",q[1]);
    r.setAttribute("width",q[2]);r.setAttribute("height",q[2]);
    r.setAttribute("class","dot");svg.appendChild(r);dots.push(r);
  });
  function layout(){
    var port=window.innerHeight>window.innerWidth;
    var L=port?PORT:LAND;
    document.body.className=port?"p":"";
    svg.setAttribute("viewBox",L.vb);
    groups.forEach(function(g,i){
      var q=L.pos[i];
      g.setAttribute("transform","translate("+q[0]+","+q[1]+") scale("+q[2]+")");
    });
    dots.forEach(function(r){r.style.display=port?"none":""});
    fitDate();
  }
  layout();
  window.addEventListener("resize",layout);
  window.addEventListener("orientationchange",layout);

  var CAN=["Giáp","Ất","Bính","Đinh","Mậu","Kỷ","Canh","Tân","Nhâm","Quý"];
  var CHI=["Tý","Sửu","Dần","Mão","Thìn","Tỵ","Ngọ","Mùi","Thân","Dậu","Tuất","Hợi"];
  function INT(d){return Math.floor(d)}
  function jdFromDate(dd,mm,yy){
    var a=INT((14-mm)/12),y=yy+4800-a,m=mm+12*a-3;
    var jd=dd+INT((153*m+2)/5)+365*y+INT(y/4)-INT(y/100)+INT(y/400)-32045;
    if(jd<2299161)jd=dd+INT((153*m+2)/5)+365*y+INT(y/4)-32083;
    return jd;
  }
  function getNewMoonDay(k,tz){
    var T=k/1236.85,T2=T*T,T3=T2*T,dr=Math.PI/180;
    var Jd1=2415020.75933+29.53058868*k+0.0001178*T2-0.000000155*T3;
    Jd1=Jd1+0.00033*Math.sin((166.56+132.87*T-0.009173*T2)*dr);
    var M=359.2242+29.10535608*k-0.0000333*T2-0.00000347*T3;
    var Mpr=306.0253+385.81691806*k+0.0107306*T2+0.00001236*T3;
    var F=21.2964+390.67050646*k-0.0016528*T2-0.00000239*T3;
    var C1=(0.1734-0.000393*T)*Math.sin(M*dr)+0.0021*Math.sin(2*dr*M);
    C1=C1-0.4068*Math.sin(Mpr*dr)+0.0161*Math.sin(dr*2*Mpr);
    C1=C1-0.0004*Math.sin(dr*3*Mpr);
    C1=C1+0.0104*Math.sin(dr*2*F)-0.0051*Math.sin(dr*(M+Mpr));
    C1=C1-0.0074*Math.sin(dr*(M-Mpr))+0.0004*Math.sin(dr*(2*F+M));
    C1=C1-0.0004*Math.sin(dr*(2*F-M))-0.0006*Math.sin(dr*(2*F+Mpr));
    C1=C1+0.0010*Math.sin(dr*(2*F-Mpr))+0.0005*Math.sin(dr*(2*Mpr+M));
    var dt=T<-11?0.001+0.000839*T+0.0002261*T2-0.00000845*T3-0.000000081*T*T3:-0.000278+0.000265*T+0.000262*T2;
    return INT(Jd1+C1-dt+0.5+tz/24);
  }
  function getSunLongitude(jdn,tz){
    var T=(jdn-2451545.5-tz/24)/36525,T2=T*T,dr=Math.PI/180;
    var M=357.52910+35999.05030*T-0.0001559*T2-0.00000048*T*T2;
    var L0=280.46645+36000.76983*T+0.0003032*T2;
    var DL=(1.914600-0.004817*T-0.000014*T2)*Math.sin(dr*M);
    DL=DL+(0.019993-0.000101*T)*Math.sin(dr*2*M)+0.000290*Math.sin(dr*3*M);
    var L=(L0+DL)*dr;
    L=L-Math.PI*2*INT(L/(Math.PI*2));
    return INT(L/Math.PI*6);
  }
  function getLunarMonth11(yy,tz){
    var off=jdFromDate(31,12,yy)-2415021;
    var k=INT(off/29.530588853);
    var nm=getNewMoonDay(k,tz);
    if(getSunLongitude(nm,tz)>=9)nm=getNewMoonDay(k-1,tz);
    return nm;
  }
  function getLeapMonthOffset(a11,tz){
    var k=INT((a11-2415021.076998695)/29.530588853+0.5),last=0,i=1;
    var arc=getSunLongitude(getNewMoonDay(k+i,tz),tz);
    do{last=arc;i++;arc=getSunLongitude(getNewMoonDay(k+i,tz),tz)}while(arc!=last&&i<14);
    return i-1;
  }
  function convertSolar2Lunar(dd,mm,yy,tz){
    var dayNumber=jdFromDate(dd,mm,yy);
    var k=INT((dayNumber-2415021.076998695)/29.530588853);
    var monthStart=getNewMoonDay(k+1,tz);
    if(monthStart>dayNumber)monthStart=getNewMoonDay(k,tz);
    var a11=getLunarMonth11(yy,tz),b11=a11,lunarYear;
    if(a11>=monthStart){lunarYear=yy;a11=getLunarMonth11(yy-1,tz)}
    else{lunarYear=yy+1;b11=getLunarMonth11(yy+1,tz)}
    var lunarDay=dayNumber-monthStart+1;
    var diff=INT((monthStart-a11)/29),lunarLeap=0,lunarMonth=diff+11;
    if(b11-a11>365){
      var lm=getLeapMonthOffset(a11,tz);
      if(diff>=lm){lunarMonth=diff+10;if(diff==lm)lunarLeap=1}
    }
    if(lunarMonth>12)lunarMonth-=12;
    if(lunarMonth>=11&&diff<4)lunarYear-=1;
    return [lunarDay,lunarMonth,lunarYear,lunarLeap];
  }
  var DUR_CLOCK=30000,DUR_DATE=10000,start=Date.now(),showDate=false,dateEl=document.getElementById("date");
  function pad(n){return ("0"+n).slice(-2)}
  function fillDate(){
    var d=new Date(),wd=d.getDay()===0?"Chủ nhật":"Thứ "+(d.getDay()+1);
    var sol=pad(d.getDate())+"/"+pad(d.getMonth()+1)+"/"+d.getFullYear();
    var l=convertSolar2Lunar(d.getDate(),d.getMonth()+1,d.getFullYear(),7);
    var lu=pad(l[0])+"/"+pad(l[1])+(l[3]?"n":"")+"/"+CAN[(l[2]+6)%10]+" "+CHI[(l[2]+8)%12];
    var lines=window.innerHeight>window.innerWidth?[wd,sol,lu]:[wd+" "+sol,lu];
    dateEl.innerHTML=lines.map(function(t){return "<div>"+t+"</div>"}).join("");
  }
  function fitDate(){
    if(!showDate)return;
    fillDate();
    dateEl.style.fontSize="100px";
    var w=dateEl.offsetWidth,h=dateEl.offsetHeight;
    var s=Math.min(window.innerWidth*0.94/w,window.innerHeight*0.9/h);
    dateEl.style.fontSize=Math.floor(100*s)+"px";
  }
  function phase(){
    var want=((Date.now()-start)%(DUR_CLOCK+DUR_DATE))>=DUR_CLOCK;
    if(want===showDate)return;
    showDate=want;
    svg.style.display=want?"none":"";
    dateEl.style.display=want?"block":"none";
    fitDate();
  }

  var prev=[];
  function draw(){
    var d=new Date();
    var s=("0"+d.getHours()).slice(-2)+("0"+d.getMinutes()).slice(-2)+("0"+d.getSeconds()).slice(-2);
    for(var i=0;i<6;i++){
      if(prev[i]===s[i])continue;
      var on=M[+s[i]];
      for(var k in digits[i])digits[i][k].setAttribute("class","seg"+(on.indexOf(k)>-1?" on":""));
      prev[i]=s[i];
    }
    phase();
    setTimeout(draw,1000-d.getMilliseconds()+5);
  }
  draw();

  function toggleFS(){
    var el=document.documentElement;
    try{
      if(document.fullscreenElement||document.webkitFullscreenElement){
        (document.exitFullscreen||document.webkitExitFullscreen).call(document);
      }else{
        var f=el.requestFullscreen||el.webkitRequestFullscreen;
        if(f)f.call(el);
      }
    }catch(e){}
  }
  document.body.addEventListener("click",toggleFS);

  var lock=null;
  function keepAwake(){
    try{
      if("wakeLock" in navigator){
        navigator.wakeLock.request("screen").then(function(l){lock=l}).catch(function(){});
      }
    }catch(e){}
  }
  keepAwake();
  document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible")keepAwake()});

  setTimeout(function(){document.getElementById("hint").className="hide"},4000);
})();
</script>
</body>
</html>
